<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221E19">
<link rel="icon" type="image/png" href="mark.png">
<link rel="manifest" href="manifest.json">
<title>סיני אבל טוב · ניהול</title>
<style>
  :root{
    --coal:#221E19; --coal2:#2E2822; --paper:#F5F1E8; --card:#fff; --ink:#26211C;
    --muted:#877867; --line:#E6DCCA;
    --seal:#C22F20; --seal-d:#9C2417; --hazard:#F2B32C; --jade:#2F7D5D; --jade-wash:#E9F3EE;
    --sh:0 1px 3px rgba(38,33,28,.1),0 1px 2px rgba(38,33,28,.06);
  }
  *{box-sizing:border-box} html,body{margin:0;overflow-x:clip}
  body{background:var(--paper);color:var(--ink);direction:rtl;font-family:'Heebo','Assistant',-apple-system,system-ui,'Arial Hebrew',sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
  input,textarea,button{font-family:inherit}
  .view{display:none} .view.on{display:block}
  .phone{max-width:440px;margin:0 auto;padding-bottom:40px}

  /* ===== header כהה ===== */
  .top{background:var(--coal);color:#fff;padding:14px 16px 13px;display:flex;align-items:center;gap:11px;
    background-image:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(242,179,44,.05) 14px 16px)}
  .stamp{width:50px;height:50px;border:none;border-radius:11px;background:url(mark.png) center/cover no-repeat;font-size:0;color:transparent;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .top .brand{font-weight:900;font-size:18px;letter-spacing:.01em}
  .top .brand em{font-style:normal;color:var(--hazard)}
  .top .tag{font-size:10.5px;color:#b7ab99;display:block;margin-top:-1px;font-weight:600}
  .top .menu{margin-inline-start:auto;font-size:11.5px;font-weight:800;color:#cfc4b2;background:none;border:none;padding:6px}

  /* ===== login ===== */
  .login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
  .login-card{width:100%;max-width:360px;text-align:center}
  .login-card .stamp{margin:0 auto 18px;width:74px;height:74px;border-radius:14px}
  .login-card h1{font-size:22px;font-weight:900;margin:0 0 4px}
  .login-card p{color:var(--muted);font-size:13px;margin:0 0 20px}
  .field{text-align:start;margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;color:var(--ink);background:#fff}
  .in:focus{outline:none;border-color:var(--seal)}
  .btn-primary{width:100%;border:none;background:var(--seal);color:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:16px;box-shadow:0 6px 18px rgba(194,47,32,.28)}
  .btn-primary:disabled{opacity:.55}

  /* ===== list ===== */
  #v-list .pad{padding:14px}
  .paste{background:var(--card);border:2px solid var(--seal);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:14px}
  .paste .t{font-weight:900;font-size:15px;margin-bottom:8px}
  .paste .box{display:flex;gap:8px}
  .paste input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:13px;direction:ltr;text-align:left;color:var(--ink)}
  .paste button{border:none;background:var(--seal);color:#fff;border-radius:11px;padding:0 18px;font-weight:800;font-size:14px}
  .paste button:disabled{opacity:.55}
  .paste .hint{font-size:11.5px;color:var(--muted);margin-top:7px}
  /* ייבוא מרובה */
  .import{margin-bottom:14px}
  .imp-toggle{width:100%;border:1px dashed var(--line);background:#fff;color:var(--muted);border-radius:12px;padding:10px;font-weight:800;font-size:13px;font-family:inherit}
  .imp-body{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .imp-body textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;color:var(--ink);background:#fff}
  .imp-body .imp-run{margin-top:10px;width:100%;border:none;background:var(--seal);color:#fff;border-radius:11px;padding:12px;font-weight:900;font-size:14px;font-family:inherit}
  .imp-body .imp-run:disabled{opacity:.55}
  .lcontrols{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .lchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .lchip.on{background:var(--coal);border-color:var(--coal);color:#fff}
  .lsort{margin-inline-start:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;color:var(--seal)}
  .prow{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:10px;margin-bottom:10px;width:100%;text-align:start;font:inherit;color:inherit}
  .prow .pth{width:62px;height:62px;border-radius:10px;flex:none;background:linear-gradient(150deg,#453e35,#2c2620);border:1px solid #3d362e;overflow:hidden;display:grid;place-items:center;color:#b7ab99;font-size:9px;font-weight:700}
  .prow .pth img{width:100%;height:100%;object-fit:cover}
  .prow .pm{min-width:0;flex:1}
  .prow .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
  .tag{font-size:10px;font-weight:900;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .tag.tested{background:var(--seal);color:#fff}
  .tag.candidate{background:var(--hazard);color:var(--coal)}
  .tag.draft{background:transparent;border:1px solid var(--hazard);color:#8a6a1f}
  .tag.pub{background:var(--jade-wash);color:var(--jade)}
  .prow .clicks{color:var(--muted);font-size:11px;font-weight:700;margin-inline-start:auto;white-space:nowrap}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:34px 12px;line-height:1.6}

  /* ===== edit (יורחב ב-S12) ===== */
  #v-edit .pad{padding:0 14px 14px}
  .statusbar{border-radius:12px;padding:9px 14px;font-size:12.5px;font-weight:800;margin-bottom:14px}
  .statusbar.ok{background:var(--jade-wash);color:var(--jade);border:1px solid #d6e8de}
  .statusbar.warn{background:rgba(242,179,44,.14);color:#8a6a1f;border:1px solid rgba(242,179,44,.5)}
  /* preview + form */
  .preview{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:12px;margin-bottom:14px}
  .preview .thumb{width:82px;height:82px;border-radius:11px;flex:none;background:linear-gradient(150deg,#453e35,#2c2620);border:1px solid #3d362e;display:grid;place-items:center;color:#b7ab99;font-size:9.5px;font-weight:700;text-align:center;line-height:1.3;overflow:hidden}
  .preview .thumb img{width:100%;height:100%;object-fit:cover}
  .preview .m{min-width:0;flex:1}
  .preview .m .src{color:var(--muted);font-size:11.5px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frm{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px}
  .lbl{font-size:12px;font-weight:800;color:var(--muted);margin:14px 0 6px}
  .lbl:first-child{margin-top:0}
  textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;min-height:62px;resize:vertical;color:var(--ink);background:#fff}
  textarea:focus{outline:none;border-color:var(--seal)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
  .chip.on{background:var(--coal);border-color:var(--coal);color:#fff}
  .tier{display:flex;gap:8px}
  .tier .opt{flex:1;border:2px solid var(--line);border-radius:13px;padding:10px;text-align:center;font-weight:800;font-size:13px;color:var(--muted);background:#fff}
  .tier .opt.on{border-color:var(--seal);color:var(--seal);background:#fdf3f1}
  .tier .opt small{display:block;font-weight:600;font-size:10.5px;margin-top:2px}
  .scores{display:grid;gap:7px}
  .scores .row{display:grid;grid-template-columns:1fr 66px;gap:8px}
  .scores .row input{border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--ink);background:#fff}
  .scores .row input.n{text-align:center;font-weight:900;color:var(--seal)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .two .lbl{margin-top:0}
  .pm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pm b{display:block;font-size:11px;margin-bottom:4px;font-weight:800}
  .pm .g b{color:var(--jade)} .pm .r b{color:var(--seal)}
  .media{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
  .media .add{width:66px;height:66px;border:2px dashed var(--hazard);border-radius:12px;display:grid;place-items:center;color:#c98f14;font-weight:900;font-size:24px;background:#fffdf7}
  .media .cell{width:66px;height:66px;border-radius:12px;position:relative;background:#2c2620;border:1px solid #3d362e;overflow:hidden}
  .media .cell img,.media .cell video{width:100%;height:100%;object-fit:cover}
  .media .cell .rm{position:absolute;top:-7px;inset-inline-end:-7px;width:22px;height:22px;border-radius:50%;background:var(--coal);color:#fff;border:2px solid var(--paper);display:grid;place-items:center;font-size:12px;font-weight:900;line-height:1}
  .media .cell .vtag{position:absolute;bottom:3px;inset-inline-start:3px;background:rgba(0,0,0,.7);color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:4px}
  .media .cell.pending{display:grid;place-items:center}
  .spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(242,179,44,.3);border-top-color:var(--hazard);animation:spin .7s linear infinite}
  @keyframes spin{100%{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  /* באנר-שחזור טיוטה */
  .restore{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:rgba(242,179,44,.14);border:1px solid rgba(242,179,44,.5);border-radius:12px;
    padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:700;color:#8a6a1f}
  .restore .ra{display:flex;gap:6px}
  .restore button{border:none;border-radius:9px;padding:6px 14px;font-weight:800;font-size:12.5px;font-family:inherit}
  .restore #rest-yes{background:var(--seal);color:#fff}
  .restore #rest-no{background:rgba(0,0,0,.08);color:var(--muted)}
  .save{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  .save .primary{flex:1.6;min-width:130px;border:none;background:var(--seal);color:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:16px;box-shadow:0 6px 18px rgba(194,47,32,.28)}
  .save .ghost{flex:1;min-width:96px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:14px;font-weight:800;font-size:14px;padding:14px 6px}
  .save button:disabled{opacity:.55}
  /* ===== הכן להרצה ===== */
  .run{background:var(--coal);border-radius:18px;margin:22px 0 0;padding:16px;color:#fff;
    background-image:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(242,179,44,.05) 14px 16px)}
  .run h2{margin:0 0 4px;font-size:16px;font-weight:900}
  .run .sub{color:#b7ab99;font-size:12.5px;margin-bottom:12px}
  .run .item{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:13px;padding:11px 13px;margin-bottom:9px}
  .run .item .t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:13px}
  .run .item .btns{display:flex;gap:6px;flex:none}
  .rbtn{background:var(--hazard);color:var(--coal);border:none;border-radius:8px;padding:5px 14px;font-size:11.5px;font-weight:900;font-family:inherit}
  .rbtn.ghost{background:rgba(255,255,255,.12);color:#fff}
  .run .prev{color:#d8cebf;font-size:12px;margin-top:8px;line-height:1.55;white-space:pre-wrap}
  .backbar{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:800}
  .backbar button{background:none;border:none;color:var(--seal);font-weight:900;font-size:14px;padding:4px}

  /* ===== toast ===== */
  #toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:22px;z-index:50;
    background:var(--coal);color:#fff;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:12px;
    box-shadow:0 8px 26px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== מסך רחב: טופס-הניהול במרכז, ברוחב נוח ===== */
  @media (min-width:768px){
    .phone{max-width:760px}
  }
</style>
</head>
<body>

<!-- ===== התחברות ===== -->
<section id="v-login" class="view on">
  <div class="login-wrap">
    <div class="login-card">
      <div class="stamp">סיני<br>אבל<br>טוב</div>
      <h1>מתחברים</h1>
      <p>הכניסה לכלי-הניהול של אור בלבד.</p>
      <div class="field">
        <label for="login-email">דוא"ל</label>
        <input id="login-email" class="in" type="email" inputmode="email" autocomplete="username" dir="ltr" placeholder="or.perias@gmail.com">
      </div>
      <div class="field">
        <label for="login-pass">סיסמה</label>
        <input id="login-pass" class="in" type="password" autocomplete="current-password" dir="ltr">
      </div>
      <button id="login-btn" class="btn-primary">כניסה</button>
    </div>
  </div>
</section>

<!-- ===== רשימה (שלד) ===== -->
<section id="v-list" class="view">
  <div class="phone">
    <div class="top">
      <div class="stamp">סיני<br>אבל<br>טוב</div>
      <div><span class="brand">המציאות <em>שלי</em></span><span class="tag">זרוק לינק, בדוק, פרסם — דקה עבודה.</span></div>
      <button class="menu" id="logout-btn">יציאה</button>
    </div>
    <div class="pad">
      <div class="paste">
        <div class="t">זרוק לינק — אני אעשה את השאר</div>
        <div class="box">
          <input id="paste-input" type="url" inputmode="url" dir="ltr" placeholder="https://s.click.aliexpress.com/...">
          <button id="paste-btn">שלוף</button>
        </div>
        <div class="hint">עלי-אקספרס או אמזון · הדבק את קישור-השותפים שלך</div>
      </div>
      <div class="import">
        <button type="button" class="imp-toggle" id="imp-toggle">＋ ייבוא מרובה — הדבק רשימה שקלוד הכין</button>
        <div class="imp-body" id="imp-body" hidden>
          <textarea id="imp-json" dir="ltr" placeholder="[ ...הדבק כאן את רשימת-המוצרים... ]"></textarea>
          <button type="button" class="imp-run" id="imp-run">העלה הכול כטיוטות</button>
        </div>
      </div>
      <div id="list-rows"><!-- רשימת המוצרים (S14) --></div>
    </div>
  </div>
</section>

<!-- ===== עריכה (שלד) ===== -->
<section id="v-edit" class="view">
  <div class="phone">
    <div class="backbar"><button id="edit-back">→ חזרה לרשימה</button></div>
    <div class="pad" id="edit-body"><!-- טופס המוצר (S12) --></div>
  </div>
</section>

<div id="toast"></div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient(SINI_CONFIG.url, SINI_CONFIG.anonKey);
const el = id => document.getElementById(id);
function show(id){ document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + id)); }
let toastT;
function toast(msg){ const t = el('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

// ===== רשימת המוצרים =====
let PRODUCTS = [];
let listFilter = 'all', listSort = 'new';
async function loadProducts(){
  const { data, error } = await sb.from('products').select('*').order('updated_at', { ascending: false });
  if (error) return toast('טעינה נכשלה — בדוק אינטרנט.');
  PRODUCTS = data; renderList();
}
// ייבוא מרובה: מדביקים רשימת-מוצרים (JSON) → כל אחד נכנס כטיוטה. רץ בדפדפן המחובר, בלי טרמינל.
async function bulkImport(text){
  let arr;
  try { arr = JSON.parse(text); } catch { return toast('הטקסט אינו JSON תקין — בדוק שהעתקת הכול.'); }
  if (!Array.isArray(arr)) arr = [arr];
  if (!arr.length) return toast('אין מוצרים לייבא.');
  const now = new Date().toISOString();
  let ok = 0;
  for (const p of arr) {
    const row = { ...emptyProduct(), ...p, status: 'draft', updated_at: now };
    delete row.id; delete row.published_at; delete row.clicks; delete row.clicks_by_source;
    const q = await sb.from('products').insert(row).select().single();
    if (q.error) { console.error(q.error); continue; }
    ok++;
  }
  toast(`נוספו ${ok}/${arr.length} טיוטות.`);
  await loadProducts();
}
function rowImg(p){
  const mi = (p.my_media || []).find(m => m.type === 'image');
  if (mi) return mediaUrl(mi.path);
  return (p.external_images || [])[0] || null;
}
function renderList(){
  const box = el('list-rows'); if (!box) return;
  let items = PRODUCTS.slice();
  if (listFilter === 'published') items = items.filter(p => p.status === 'published');
  else if (listFilter === 'draft') items = items.filter(p => p.status === 'draft');
  items.sort((a, b) => listSort === 'clicks'
    ? (b.clicks || 0) - (a.clicks || 0)
    : new Date(b.updated_at) - new Date(a.updated_at));

  const chip = (k, t) => `<button type="button" class="lchip${listFilter === k ? ' on' : ''}" data-f="${k}">${t}</button>`;
  const rowsHtml = items.length ? items.map(p => {
    const img = rowImg(p);
    const tierTag = p.tier === 'tested' ? '<span class="tag tested">נבדק ✓</span>' : '<span class="tag candidate">בבדיקה</span>';
    const statusTag = p.status === 'published' ? '<span class="tag pub">פורסם</span>' : '<span class="tag draft">טיוטה</span>';
    return `<button type="button" class="prow" data-id="${esc(p.id)}">
      <div class="pth">${img ? `<img src="${esc(img)}" alt="">` : 'אין<br>תמונה'}</div>
      <div class="pm">
        <div class="nm">${esc(p.title) || '(בלי שם)'}</div>
        <div class="tags">${tierTag}${statusTag}<span class="clicks">${p.clicks || 0} קליקים</span></div>
      </div>
    </button>`;
  }).join('') : `<div class="empty">${listFilter === 'draft' ? 'אין טיוטות.' : listFilter === 'published' ? 'עוד לא פרסמת כלום.' : 'עוד אין מוצרים. זרוק לינק למעלה כדי להתחיל.'}</div>`;

  box.innerHTML = `
    <div class="lcontrols">
      ${chip('all', 'הכל')}${chip('published', 'פורסם')}${chip('draft', 'טיוטות')}
      <button type="button" class="lsort">${listSort === 'new' ? 'חדש קודם' : 'הכי מריצים'}</button>
    </div>
    ${rowsHtml}`;

  box.querySelectorAll('.lchip').forEach(b => b.addEventListener('click', () => { listFilter = b.dataset.f; renderList(); }));
  box.querySelector('.lsort').addEventListener('click', () => { listSort = listSort === 'new' ? 'clicks' : 'new'; renderList(); });
  box.querySelectorAll('.prow').forEach(b => b.addEventListener('click', () => {
    const p = PRODUCTS.find(x => x.id === b.dataset.id);
    if (!p) return;
    draft = structuredClone(p);
    renderEdit(null);
    show('edit');
  }));
}

// ===== זרימת "זרוק לינק" =====
const CATEGORIES = ['כלים חשמליים','כלי-יד','מדידה ולייזר','אחסון וסדר','בטיחות'];
let draft = null;
function emptyProduct(){ return { title:'', marketplace:'ali', source_url:'', affiliate_url:'',
  price_approx:null, price_israel:null, currency:'ILS', category:CATEGORIES[0], tier:'tested',
  punchline:'', verdict:'', test_note:'', test_date:null,

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const mediaUrl = path => sb.storage.from('media').getPublicUrl(path).data.publicUrl;
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function compressImage(file, max = 1600){
  const img = await loadImg(URL.createObjectURL(file));
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}
let uploading = 0;
function updatePublishLock(){
  const pub = el('btn-publish'), dr = el('btn-draft');
  const busy = uploading > 0;
  if (pub) { pub.disabled = busy; pub.textContent = busy ? 'מעלה תמונות…' : 'פרסם לאתר'; }
  if (dr) dr.disabled = busy;
}
async function addMedia(files){
  for (const f of files) {
    if (f.size > 60 * 1024 * 1024) { toast('קובץ גדול מדי (מעל 60MB).'); continue; }
    const isVideo = f.type.startsWith('video/');
    const ph = { path: null, type: isVideo ? 'video' : 'image', caption: '', pending: true };
    draft.my_media.push(ph);
    uploading++; updatePublishLock(); renderMedia();
    try {
      const blob = isVideo ? f : await compressImage(f);
      const path = `products/${crypto.randomUUID()}${isVideo ? '.mp4' : '.jpg'}`;
      const { error } = await sb.storage.from('media').upload(path, blob, { contentType: isVideo ? f.type : 'image/jpeg' });
      if (error) throw error;
      ph.path = path; delete ph.pending;
    } catch (e) {
      const i = draft.my_media.indexOf(ph);
      if (i > -1) draft.my_media.splice(i, 1);
      toast(isVideo ? 'העלאת הסרטון נכשלה. נסה שוב.' : 'העלאת התמונה נכשלה (אולי פורמט לא נתמך). נסה שוב.');
    } finally {
      uploading--; updatePublishLock(); renderMedia(); scheduleAutosave();
    }
  }
}
function renderMedia(){
  const box = el('f-media'); if (!box) return;
  box.innerHTML = `<button type="button" class="add" id="media-add">+</button>` +
    draft.my_media.map((m, i) => {
      if (m.pending) return `<div class="cell pending"><span class="spin"></span></div>`;
      const u = mediaUrl(m.path);
      const inner = m.type === 'video'
        ? `<video src="${esc(u)}#t=0.1" muted playsinline></video><span class="vtag">סרטון</span>`
        : `<img src="${esc(u)}" alt="">`;
      return `<div class="cell">${inner}<button type="button" class="rm" data-i="${i}">×</button></div>`;
    }).join('');
  el('media-add').addEventListener('click', () => el('f-file').click());
  box.querySelectorAll('.rm').forEach(b => b.addEventListener('click', () => {
    draft.my_media.splice(Number(b.dataset.i), 1); renderMedia(); scheduleAutosave();
  }));
}

const numOrNull = v => { const t = String(v ?? '').trim(); return t === '' ? null : Number(t); };

let saving = false;
// מחזיר את כל שדות emptyProduct כשהם נקראים מה-DOM (טקסטים) ומ-draft (מדיה/מטא).
// לעולם לא: id, clicks, created_at, status, published_at — בהם מטפלת save().
function collectForm(){

    external_images: draft.external_images,
    my_media: draft.my_media.filter(m => m.path),   // בלי פריטים שעדיין בהעלאה
    video_url: draft.video_url,

}
async function save(publish){
  if (saving) return;                                   // מונע כפילות מדאבל-טאפ
  if (uploading > 0) return toast('רגע — עוד מעלה תמונות. נסה שוב כשזה נגמר.');
  const p = collectForm();
  if (publish && !p.title.trim()) return toast('חסר שם מוצר.');
  if (publish && !p.affiliate_url.trim()) return toast('חסר קישור.');
  if (publish && !isValidUrl(p.affiliate_url)) return toast('הקישור לא תקין — צריך להתחיל ב-https://');
  if (publish && p.tier === 'tested' && (!p.verdict.trim() || !p.my_media.some(m => m.type === 'image')))
    return toast("כדי לפרסם 'נבדק על-ידי אור' צריך: חוות-דעת + לפחות צילום אחד שלך.");
  saving = true;
  document.querySelectorAll('.save button').forEach(b => b.disabled = true);
  p.status = publish ? 'published' : 'draft';
  p.updated_at = new Date().toISOString();
  if (publish && !draft.published_at) p.published_at = p.updated_at;
  try {
    let q;
    if (draft.id) q = await sb.from('products').update(p).eq('id', draft.id).select().single();
    else q = await sb.from('products').insert(p).select().single();
    if (q.error) { console.error(q.error); toast('השמירה נכשלה — בדוק אינטרנט ונסה שוב.'); return; }
    draft = q.data;
    clearAutosave();
    toast(publish ? 'עלה לאתר.' : 'נשמר.');
    await loadProducts();
    renderEdit(null);   // רה-רנדר: מציג "הכן להרצה" ומחבר את wireRun ל-draft העדכני
  } finally {
    saving = false;
    document.querySelectorAll('.save button').forEach(b => b.disabled = false);
  }
}

// ===== שמירת-טיוטה אוטומטית — מגן מאובדן-עבודה ברענון/סגירת-טאב =====
const AUTOSAVE_KEY = 'sini_draft_v1';
let dirty = false, autosaveT;
function scheduleAutosave(){
  if (!el('f-title')) return;                 // רק כשטופס-העריכה על המסך
  dirty = true;
  clearTimeout(autosaveT);
  autosaveT = setTimeout(() => {
    try {
      const snap = { ...collectForm(), id: draft.id || null, published_at: draft.published_at || null, _ts: Date.now() };
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(snap));
    } catch {}
  }, 500);
}
function clearAutosave(){ dirty = false; clearTimeout(autosaveT); try { localStorage.removeItem(AUTOSAVE_KEY); } catch {} }
function loadAutosave(){ try { const s = localStorage.getItem(AUTOSAVE_KEY); return s ? JSON.parse(s) : null; } catch { return null; } }
function maybeOfferRestore(){
  const snap = loadAutosave();
  if (!snap) return;
  const hasContent = (snap.title && snap.title.trim()) || snap.affiliate_url || (snap.my_media && snap.my_media.length);
  const fresh = snap._ts && (Date.now() - snap._ts) < 1000 * 60 * 60 * 24;   // עד 24 שעות
  if (!hasContent || !fresh) return clearAutosave();
  const host = document.querySelector('#v-list .pad'); if (!host) return;
  if (host.querySelector('.restore')) return;
  const bar = document.createElement('div');
  bar.className = 'restore';
  bar.innerHTML = `<span>יש טיוטה שלא נשמרה מהפעם הקודמת.</span>
    <span class="ra"><button type="button" id="rest-yes">שחזר</button><button type="button" id="rest-no">מחק</button></span>`;
  host.insertBefore(bar, host.firstChild);
  el('rest-yes').addEventListener('click', () => {
    draft = { ...emptyProduct(), ...snap };
    bar.remove(); renderEdit('שוחזרה טיוטה שלא נשמרה — בדוק ושמור.'); show('edit');
  });
  el('rest-no').addEventListener('click', () => { clearAutosave(); bar.remove(); });
}

// ===== "הכן להרצה" — שלושה תוצרים לשיתוף =====

// את מבחן-השטח וההשוואה, שהקליק יימדד (?src=), ושתצוגת-הלינק בוואטסאפ תציג את המותג.
const SITE = 'https://orperias-coder.github.io/sini-aval-tov/';
const DISCLOSURE = 'שקיפות: קישור-שותפים — קנייה דרכו מזכה אותי בעמלה קטנה, בלי תוספת מחיר לכם.';
const productLink = (p, src) => `${SITE}#p/${p.id}?src=${src}`;
function waMessage(p){

  if (p.price_israel) l += ` (בחנות בארץ: ₪${Math.round(p.price_israel)}+)`;

async function copyText(t){ await navigator.clipboard.writeText(t); toast('הועתק.'); }

function rr(x, a, b, w, h, r){ x.beginPath(); x.roundRect(a, b, w, h, r); }
function wrapText(x, text, right, top, maxW, lh){
  const words = (text || '').split(/\s+/); let line = '', y = top;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (x.measureText(t).width > maxW && line) {
      x.fillText(line, right, y); line = w; y += lh;
      if (y > top + lh * 2) { line += '…'; break; }
    } else line = t;
  }
  x.fillText(line, right, y);
}
async function buildShareImage(p){
  const W = 1080, H = 1080, IMG_H = 680;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.direction = 'rtl'; x.textAlign = 'right';
  x.fillStyle = '#F5F1E8'; x.fillRect(0, 0, W, H);
  const first = p.my_media.find(m => m.type === 'image');
  const src = first ? mediaUrl(first.path) : (p.external_images[0] || null);
  if (src) { try {
    const img = await loadImg(src);
    const s = Math.max(W / img.width, IMG_H / img.height);
    x.drawImage(img, (W - img.width * s) / 2, (IMG_H - img.height * s) / 2, img.width * s, img.height * s);
  } catch (e) {} }
  x.fillStyle = '#221E19'; x.fillRect(0, IMG_H, W, H - IMG_H);
  const tested = p.tier === 'tested';
  x.save(); x.translate(W - 40, 64); x.rotate(-0.05);
  x.fillStyle = tested ? '#C22F20' : '#F2B32C';
  rr(x, -310, -36, 310, 72, 14); x.fill();
  x.fillStyle = tested ? '#fff' : '#221E19';
  x.font = '900 38px Heebo, Arial';
  x.fillText(tested ? 'נבדק בשטח ✓' : 'בבדיקה עכשיו', -28, 13); x.restore();
  x.save(); x.translate(96, IMG_H + 92); x.rotate(-0.09);
  x.fillStyle = '#C22F20'; rr(x, -64, -64, 128, 128, 16); x.fill();
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = '900 32px Heebo, Arial';
  x.fillText('סיני', 0, -20); x.fillText('אבל', 0, 14); x.fillText('טוב', 0, 48);
  x.restore(); x.textAlign = 'right';
  x.fillStyle = '#fff'; x.font = '900 54px Heebo, Arial';
  wrapText(x, p.title, W - 56, IMG_H + 100, W - 260, 64);
  if (p.price_approx) {
    x.fillStyle = '#F2B32C'; x.font = '900 84px Heebo, Arial';
    x.fillText(`₪${Math.round(p.price_approx)}`, W - 56, H - 60);
    if (p.price_israel) {
      const t = `בחנות בארץ: ₪${Math.round(p.price_israel)}+`;
      x.fillStyle = '#B7AB99'; x.font = '700 34px Heebo, Arial';
      const w = x.measureText(t).width;
      x.fillText(t, 60 + w, H - 72);
      x.strokeStyle = '#B7AB99'; x.lineWidth = 3;
      x.beginPath(); x.moveTo(60, H - 84); x.lineTo(60 + w, H - 84); x.stroke();
    }
  }
  return new Promise(r => c.toBlob(r, 'image/jpeg', .9));
}
async function shareImage(p){
  const blob = await buildShareImage(p);
  const file = new File([blob], 'sini-tov.jpg', { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
  else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    toast('התמונה ירדה להורדות — שתף אותה מהגלריה.'); }
}
function fbPost(p){
  const rows = [`${p.title}${p.punchline ? ' — ' + p.punchline : ''}`, ''];
  if (p.verdict) rows.push(p.verdict, '');
  if (p.pros.length) rows.push('מה טוב:', ...p.pros.map(v => '- ' + v));
  if (p.cons.length) rows.push('שווה לדעת:', ...p.cons.map(v => '- ' + v));
  rows.push('');
  if (p.price_approx) rows.push(`מחיר משוער: ₪${Math.round(p.price_approx)}${p.price_israel ? ` (בחנות בארץ ₪${Math.round(p.price_israel)}+)` : ''}`);
  rows.push(productLink(p, 'fb'), '', 'שקיפות: זה קישור-שותפים שלי — אם קונים דרכו אני מקבל עמלה קטנה, לכם זה לא עולה כלום.');
  return rows.join('\n');
}
function wireRun(p){
  el('wa-prev').textContent = waMessage(p);
  el('fb-prev').textContent = fbPost(p);
  el('wa-share').addEventListener('click', () => window.open('https://wa.me/?text=' + encodeURIComponent(waMessage(p)), '_blank'));
  el('wa-copy').addEventListener('click', () => copyText(waMessage(p)));
  el('img-share').addEventListener('click', () => shareImage(p));
  el('fb-copy').addEventListener('click', () => copyText(fbPost(p)));
}

el('login-btn').addEventListener('click', async () => {
  const btn = el('login-btn'); btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: el('login-email').value.trim(), password: el('login-pass').value });
  btn.disabled = false;
  if (error) return toast('פרטים לא נכונים. נסה שוב.');
  await loadProducts(); show('list'); maybeOfferRestore();
});
el('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') el('login-btn').click(); });

el('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); show('login'); });
el('edit-back').addEventListener('click', () => show('list'));

// autosave: כל הקלדה בטופס-העריכה נשמרת מקומית; אזהרה לפני יציאה עם שינויים לא-שמורים
el('edit-body').addEventListener('input', scheduleAutosave);
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) { await loadProducts(); show('list'); maybeOfferRestore(); } else show('login');
}
init();
</script>
