<!-- שיתוף חברתי (OG/Twitter) — כרטיס-התצוגה של כל לינק שמשותף בוואטסאפ/פייסבוק -->

<link rel="preconnect" href="https://acsynyyhwkqafxvkxhfa.supabase.co" crossorigin>
<style>
  :root{
    --coal:#221E19; --coal2:#2E2822; --paper:#F5F1E8; --card:#fff; --ink:#26211C;
    --muted:#877867; --line:#E6DCCA;
    --seal:#C22F20; --seal-d:#9C2417; --hazard:#F2B32C; --jade:#2F7D5D; --jade-wash:#E9F3EE;
    --sh:0 1px 3px rgba(38,33,28,.1),0 1px 2px rgba(38,33,28,.06);
  }
  *{box-sizing:border-box} html,body{margin:0;overflow-x:clip}
  body{background:var(--paper);color:var(--ink);direction:rtl;font-family:'Heebo','Assistant',-apple-system,system-ui,'Arial Hebrew',sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
  input,button{font-family:inherit}
  .phone{max-width:440px;margin:0 auto;padding-bottom:110px}
  .pad{padding:0 14px}
  a{color:inherit;text-decoration:none}

  /* ===== header כהה ===== */
  .top{background:var(--coal);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:11px;
    background-image:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(242,179,44,.05) 14px 16px)}
  .stamp{width:50px;height:50px;border:none;border-radius:11px;background:url(mark.png) center/cover no-repeat;font-size:0;color:transparent;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .top .brand{font-weight:900;font-size:18px;letter-spacing:.01em}
  .top .brand em{font-style:normal;color:var(--hazard)}
  .top .tag{font-size:10.5px;color:#b7ab99;display:block;margin-top:-1px;font-weight:600}
  .top .back{margin-inline-start:auto;font-size:12px;font-weight:800;color:#cfc4b2;background:none;border:none;padding:6px}

  /* ===== home ===== */
  .promise{background:var(--coal);color:#e9dfce;font-size:12px;font-weight:600;text-align:center;padding:0 16px 14px;
    background-image:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(242,179,44,.05) 14px 16px)}
  .search{margin:14px}
  .search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;background:#fff;color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--seal)}
  .catbar{display:flex;gap:7px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
  .catbar::-webkit-scrollbar{display:none}
  .cchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;color:var(--muted)}
  .cchip.on{background:var(--coal);border-color:var(--coal);color:#fff}
  h3.sec{font-size:15px;font-weight:900;margin:18px 18px 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
  .rc{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden;display:block}
  .rc .im{height:120px;background:linear-gradient(155deg,#453e35,#2c2620);position:relative;display:grid;place-items:center;color:#b7ab99;font-size:10px;font-weight:700}
  .rc .im img{width:100%;height:100%;object-fit:cover}
  .rc .im .tg{position:absolute;top:7px;inset-inline-start:7px;font-size:9px;font-weight:900;padding:2px 8px;border-radius:6px;background:var(--seal);color:#fff;transform:rotate(-3deg);z-index:1}
  .rc .im .tg.c{background:var(--hazard);color:var(--coal)}
  .rc .b{padding:9px 11px}
  .rc .b .t{font-weight:800;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
  .rc .b .pun{color:var(--muted);font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rc .b .p{color:var(--seal);font-weight:900;font-size:14px;margin-top:5px;font-variant-numeric:tabular-nums}
  .emptybox{grid-column:1 / -1;color:var(--muted);font-size:14px;text-align:center;padding:30px 12px;line-height:1.7}
  /* מצב-אפס עשיר כשאין עדיין מוצרים ב-DB */
  .zero{grid-column:1 / -1;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:22px 18px;text-align:center}
  .zero .seal{width:56px;height:56px;border-radius:12px;background:url(mark.png) center/cover no-repeat;margin:0 auto 12px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .zero h4{margin:0 0 6px;font-size:16px;font-weight:900}
  .zero p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.65}
  /* שלד-טעינה */
  .sk{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .sk .im{height:120px}
  .sk .b{padding:9px 11px}
  .sk .ln{height:11px;border-radius:6px;background:var(--line);margin:5px 0}
  .sk .ln.s{width:60%}
  .shimmer{position:relative;overflow:hidden}
  .shimmer::after{content:"";position:absolute;inset:0;transform:translateX(100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sh 1.3s infinite}
  @keyframes sh{100%{transform:translateX(-100%)}}
  @media (prefers-reduced-motion:reduce){.shimmer::after{animation:none}}
  /* מצב-שגיאה */
  .errbox{grid-column:1 / -1;text-align:center;padding:34px 16px;color:var(--muted)}
  .errbox b{display:block;color:var(--ink);font-size:15px;font-weight:800;margin-bottom:6px}
  .errbox button{margin-top:12px;border:1px solid var(--line);background:#fff;color:var(--seal);
    border-radius:11px;padding:9px 20px;font-weight:800;font-size:14px;font-family:inherit}
  /* איך אני בודק — שכבת-אמון בבית */
  .howbox{margin:26px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:14px 16px}
  .howbox b{display:block;font-size:14px;font-weight:900;margin-bottom:8px}
  .howbox .steps{display:grid;gap:7px}
  .howbox .steps div{font-size:13px;color:var(--ink);padding-inline-start:22px;position:relative}
  .howbox .steps div::before{content:"✓";position:absolute;inset-inline-start:0;color:var(--jade);font-weight:900}
  .foot{margin-top:26px;padding:16px;color:var(--muted);font-size:11px;text-align:center;line-height:1.7;border-top:1px solid var(--line)}

  /* ===== hero מוצר (S17) ===== */
  .hero{background:var(--coal);color:#fff;padding:6px 16px 20px}
  .hero .shot{height:300px;border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 70% 20%, #4a4139 0%, #37312a 45%, #24201b 100%);border:1px solid #3d362e}
  .hero .shot .main{position:absolute;inset:0;display:grid;place-items:center}
  .hero .shot .main img,.hero .shot .main video{width:100%;height:100%;object-fit:cover}
  .hero .shot .pht{color:#cfc4b2;font-weight:800;font-size:13px;text-align:center;padding:20px}
  .hero .badge{position:absolute;top:13px;inset-inline-start:13px;background:var(--seal);color:#fff;font-weight:900;font-size:12.5px;padding:7px 14px;border-radius:9px;transform:rotate(-3deg);box-shadow:0 5px 14px rgba(194,47,32,.45);z-index:2}
  .hero .badge.c{background:var(--hazard);color:var(--coal)}
  .hero .mine{position:absolute;bottom:12px;inset-inline-end:12px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:8px;z-index:2}
  .thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .thumbs::-webkit-scrollbar{display:none}
  .th{width:60px;height:60px;border-radius:11px;border:2px solid transparent;background:linear-gradient(155deg,#3c352d,#2a251f);flex:none;position:relative;overflow:hidden;display:grid;place-items:center;font-size:8.5px;color:#b7ab99;font-weight:700}
  .th img,.th video{width:100%;height:100%;object-fit:cover}
  .th.on{border-color:var(--hazard)}
  .th.vid::after{content:"▶";position:absolute;color:#fff;font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .hero h1{margin:16px 0 2px;font-size:23px;font-weight:900;line-height:1.2;letter-spacing:-.01em}
  .hero .punch{color:var(--hazard);font-weight:800;font-size:14px}

  .buy{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);margin:-12px 14px 0;position:relative;padding:14px 16px}
  .buy .row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .buy .now{font-size:32px;font-weight:900;color:var(--seal);font-variant-numeric:tabular-nums}
  .buy .was{color:var(--muted);font-size:13px}
  .buy .was b{text-decoration:line-through;font-weight:700}
  .buy .savechip{background:var(--hazard);color:var(--coal);font-weight:900;font-size:11.5px;padding:3px 10px;border-radius:7px;margin-inline-start:auto}
  .buy .sub{color:var(--muted);font-size:11.5px;margin-top:4px}

  .test{background:var(--coal);border-radius:16px;margin:14px;padding:15px 16px;color:#fff}
  .test .t{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14.5px;margin-bottom:3px}
  .test .t .mk{width:22px;height:22px;border-radius:6px;background:var(--hazard);color:var(--coal);display:grid;place-items:center;font-size:11px;font-weight:900;transform:rotate(-4deg)}
  .test .subt{color:#b7ab99;font-size:11.5px;margin-bottom:12px}
  .bar{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;margin-top:8px;font-size:12.5px;font-weight:700}
  .bar .tr{display:block;height:9px;background:#453d33;border-radius:99px;overflow:hidden}
  .bar .fl{display:block;height:100%;background:linear-gradient(90deg,var(--hazard),#f6c95e);border-radius:99px}
  .bar .num{font-weight:900;color:var(--hazard);text-align:left;font-variant-numeric:tabular-nums}
  .verdictline{margin-top:13px;border-top:1px solid #3a332b;padding-top:11px;font-size:14px;font-weight:600;color:#f0e9dc}
  .who{display:flex;align-items:center;gap:8px;margin-top:9px;color:#b7ab99;font-size:11.5px}
  .who .face{width:28px;height:28px;border-radius:50%;background:linear-gradient(150deg,#5a5044,#3c352d);border:1px solid #4a4238;flex:none}
  .candbox{background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--hazard);border-radius:12px;margin:14px;padding:12px 14px;color:var(--ink);font-size:13.5px;font-weight:600;box-shadow:var(--sh)}

  .pm{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 14px}
  .pm .col{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 13px;font-size:13px;box-shadow:var(--sh)}
  .pm .col b{display:block;font-size:11.5px;margin-bottom:5px}
  .pm .col.g b{color:var(--jade)} .pm .col.r b{color:var(--seal)}
  .pm .col div{padding:2px 0}

  .rel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px}
  .disc{margin:20px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:11px;line-height:1.6}

  .cta{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;padding:10px 14px calc(16px + env(safe-area-inset-bottom));z-index:20;
    background:linear-gradient(180deg,rgba(245,241,232,0),var(--paper) 40%)}
  .cta button{width:100%;border:none;background:var(--seal);color:#fff;border-radius:15px;padding:16px;font-weight:900;font-size:17.5px;box-shadow:0 8px 24px rgba(194,47,32,.38)}
  .cta .sub{text-align:center;color:var(--muted);font-size:10.5px;margin-top:5px}

  /* ===== מסך רחב: פריסת-מחשב אמיתית ===== */
  @media (min-width:768px){
    .phone{max-width:1040px;padding-bottom:56px}
    .top{padding:20px 30px 18px;gap:14px}
    .top .stamp{width:54px;height:54px;font-size:11px;border-radius:11px}
    .top .brand{font-size:23px}
    .top .tag{font-size:12.5px}
    .top .back{font-size:14px}
    .promise{font-size:14px;padding:0 30px 20px}
    .search{max-width:580px;margin:22px auto 8px}
    .search input{padding:14px 18px;font-size:16px}
    .catbar{flex-wrap:wrap;overflow:visible;justify-content:center;padding:6px 24px 2px;gap:10px}
    .cchip{font-size:14px;padding:8px 18px}
    h3.sec{font-size:20px;margin:30px 26px 16px}
    .grid{grid-template-columns:repeat(3,1fr);gap:20px;padding:0 26px}
    .rc .im{height:190px}
    .rc .b{padding:13px 15px}
    .rc .b .t{font-size:15.5px}
    .rc .b .pun{font-size:12.5px}
    .rc .b .p{font-size:17px}
    .foot{font-size:12.5px;margin-top:44px;padding:24px}

    /* דף-מוצר: שתי עמודות — גלריה | פרטים */
    .pcols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:30px;align-items:start;padding:10px 26px 0}
    .pmedia{position:sticky;top:20px}
    .hero{border-radius:20px;padding:14px 16px 18px;margin:0}
    .hero .shot{height:360px}
    .hero h1{font-size:26px}
    .pinfo{display:flex;flex-direction:column;gap:16px}
    .pinfo>*{margin:0 !important}
    .cta{position:static;max-width:none;margin:0;padding:0;background:none;z-index:auto}
    .cta button{padding:17px;font-size:18px}
    .cta .sub{margin-top:8px}
    .rel{grid-template-columns:repeat(4,1fr);margin:22px 26px 0}
    .disc{margin:24px 26px 0}
  }
  @media (min-width:1120px){
    .phone{max-width:1160px}
    .grid{grid-template-columns:repeat(4,1fr)}
  }
</style>
</head>
<body>
<div id="app">
  <!-- שלד סטטי: נצבע מיד, לפני שה-JS וה-DB עונים. renderHome/renderProduct דורסים אותו. -->
  <div class="phone">
    <div class="top">
      <div class="stamp">סיני<br>אבל<br>טוב</div>
      <div><span class="brand">סיני <em>אבל טוב</em></span><span class="tag">כלים שעברו אצלי בשטח. בלי הימורים.</span></div>
    </div>
    <div class="promise">מזמין, בודק במו-ידיי, ונותן חותמת. רק מה שעובד — נכנס לרשימה.</div>
    <div class="search"><input type="search" placeholder="חפש כלי..." aria-hidden="true" tabindex="-1"></div>
    <h3 class="sec">נבדקו לאחרונה</h3>
    <div class="grid">
      <div class="sk"><div class="im shimmer"></div><div class="b"><div class="ln"></div><div class="ln s"></div></div></div>
      <div class="sk"><div class="im shimmer"></div><div class="b"><div class="ln"></div><div class="ln s"></div></div></div>
      <div class="sk"><div class="im shimmer"></div><div class="b"><div class="ln"></div><div class="ln s"></div></div></div>
      <div class="sk"><div class="im shimmer"></div><div class="b"><div class="ln"></div><div class="ln s"></div></div></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient(SINI_CONFIG.url, SINI_CONFIG.anonKey);
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const CATEGORIES = ['כלים חשמליים','כלי-יד','מדידה ולייזר','אחסון וסדר','בטיחות'];
const HEB_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const fmtMonth = d => { if (!d) return ''; const dt = new Date(d); return isNaN(dt) ? '' : `${HEB_MONTHS[dt.getMonth()]} ${dt.getFullYear()}`; };
const mediaUrl = path => sb.storage.from('media').getPublicUrl(path).data.publicUrl;
function cardImg(p){
  const mi = (p.my_media || []).find(m => m.type === 'image');
  if (mi) return mediaUrl(mi.path);
  return (p.external_images || [])[0] || null;
}
const brandHeader = back => `
  <div class="top">
    <div class="stamp">סיני<br>אבל<br>טוב</div>
    <div><span class="brand">סיני <em>אבל טוב</em></span><span class="tag">כלים שעברו אצלי בשטח. בלי הימורים.</span></div>
    ${back ? '<button class="back" id="go-home">→ לכל הכלים</button>' : ''}
  </div>`;

let PRODUCTS = [];
let loadError = false;
let clickSrc = 'site';   // מקור-התנועה (?src=) — נשמר ונשלח ל-register_click
async function load(){
  const { data, error } = await sb.from('products').select('*').eq('status', 'published')
    .order('published_at', { ascending: false });
  if (error) { loadError = true; renderError(); return; }
  loadError = false; PRODUCTS = data || []; route();
}
// hash בפורמט  p/<id>?src=wa  — מפריד מזהה מפרמטרים
function parseHash(){
  const m = location.hash.slice(1).match(/^p\/([^?]+)(?:\?(.*))?$/);
  if (!m) return { id: null, src: null };
  return { id: m[1], src: new URLSearchParams(m[2] || '').get('src') };
}
function route(){
  if (loadError) return renderError();
  const { id, src } = parseHash();
  if (src) clickSrc = src.replace(/[^a-z0-9_-]/gi, '').slice(0, 24) || 'site';
  const p = id && PRODUCTS.find(x => x.id === id);
  p ? renderProduct(p) : renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
function renderError(){
  el('app').innerHTML = `
    <div class="phone">
      ${brandHeader(false)}
      <div class="grid"><div class="errbox">
        <b>משהו נתקע בטעינה</b>
        רגע של חוסר-חיבור, כנראה. נסה שוב עוד רגע.
        <br><button type="button" id="err-retry">רענן</button>
      </div></div>
    </div>`;
  el('err-retry').addEventListener('click', () => location.reload());
}

// ===== מסך-הבית =====
let homeSearch = '', homeCat = 'all';
function renderHome(){
  const cats = ['all', ...CATEGORIES];
  el('app').innerHTML = `
    <div class="phone">
      ${brandHeader(false)}
      <div class="promise">מזמין, בודק במו-ידיי, ונותן חותמת. רק מה שעובד — נכנס לרשימה.</div>
      <div class="search"><input id="q" type="search" aria-label="חיפוש כלי" placeholder="חפש כלי..." value="${esc(homeSearch)}"></div>
      <div class="catbar" id="catbar">${cats.map(c => `<button type="button" class="cchip${homeCat === c ? ' on' : ''}" data-c="${esc(c)}">${c === 'all' ? 'הכל' : esc(c)}</button>`).join('')}</div>
      <h3 class="sec">נבדקו לאחרונה</h3>
      <div class="grid" id="home-grid"></div>
      <div class="howbox">
        <b>איך אני בודק</b>
        <div class="steps">
          <div>מזמין את הכלי בכסף שלי — לא דוגמית מהיצרן.</div>
          <div>מפעיל אותו בעבודת-אמת בשטח, לא בסרטון-סטודיו.</div>
          <div>נותן ציונים וחוות-דעת כנה — וגם מה שפחות טוב.</div>
          <div>רק מה שעובד אצלי מקבל חותמת ונכנס לרשימה.</div>
        </div>
      </div>
      <div class="foot">הקישורים באתר הם קישורי-שותפים · סיני אבל טוב · הבדיקות של אור</div>
    </div>`;
  el('q').addEventListener('input', e => { homeSearch = e.target.value; renderGrid(); });
  el('catbar').querySelectorAll('.cchip').forEach(b => b.addEventListener('click', () => {
    homeCat = b.dataset.c;
    el('catbar').querySelectorAll('.cchip').forEach(x => x.classList.toggle('on', x === b));
    renderGrid();
  }));
  renderGrid();
}
function renderGrid(){
  const box = el('home-grid'); if (!box) return;
  const q = homeSearch.trim().toLowerCase();
  let items = PRODUCTS.filter(p => homeCat === 'all' || p.category === homeCat);
  if (q) items = items.filter(p => (p.title + ' ' + (p.punchline || '')).toLowerCase().includes(q));
  if (!items.length) {
    box.innerHTML = !PRODUCTS.length
      ? `<div class="zero"><div class="seal"></div>
          <h4>המוצרים הראשונים עולים ממש עכשיו</h4>
          <p>אני אור, קבלן גגות. אני מזמין כלים מעלי-אקספרס, בודק אותם בעצמי בעבודה בשטח — ורק מה שבאמת עובד נכנס לכאן. שווה לחזור בקרוב.</p></div>`
      : q
        ? `<div class="emptybox">לא מצאתי כלי בשם הזה. נסה מילה אחרת, או עיין בקטגוריות.</div>`
        : `<div class="emptybox">עוד אין כלום בקטגוריה הזו — בקרוב.</div>`;
    return;
  }
  box.innerHTML = items.map(p => {
    const img = cardImg(p);
    const tag = p.tier === 'tested' ? '<span class="tg">נבדק ✓</span>' : '<span class="tg c">בבדיקה עכשיו</span>';
    return `<a class="rc" href="#p/${esc(p.id)}">
      <div class="im">${tag}${img ? `<img src="${esc(img)}" alt="">` : 'אין תמונה'}</div>
      <div class="b">
        <div class="t">${esc(p.title)}</div>
        ${p.punchline ? `<div class="pun">${esc(p.punchline)}</div>` : ''}
        ${p.price_approx ? `<div class="p">₪${Math.round(p.price_approx)}</div>` : ''}
      </div>
    </a>`;
  }).join('');
}

// ===== דף-המוצר =====
function galleryItems(p){
  const items = [];
  (p.my_media || []).forEach(m => items.push({ type: m.type, src: mediaUrl(m.path), mine: true }));
  (p.external_images || []).forEach(u => items.push({ type: 'image', src: u, mine: false }));
  return items;
}
function ctaText(p){
  if (p.cta_text && p.cta_text.trim()) return p.cta_text.trim();
  return p.marketplace === 'amazon' ? 'קח את זה באמזון ←' : 'קח את זה באלי-אקספרס ←';
}
let current = null;
function renderProduct(p){
  current = p;
  const tested = p.tier === 'tested';
  const items = galleryItems(p);
  const marketName = p.marketplace === 'amazon' ? 'אמזון' : 'עלי-אקספרס';

  // מחיר + חיסכון
  let saveChip = '', wasLine = '';
  if (p.price_israel) {
    wasLine = `<span class="was">בחנות בארץ: <b dir="ltr">₪${Math.round(p.price_israel)}+</b></span>`;
    if (p.price_approx) {
      const n = Math.round((1 - p.price_approx / p.price_israel) * 100);
      if (n >= 20) saveChip = `<span class="savechip">חוסך ~${n}%</span>`;
    }
  }
  const buyCard = p.price_approx ? `
    <div class="buy">
      <div class="row1"><span class="now">₪${Math.round(p.price_approx)}</span>${wasLine}${saveChip}</div>
      <div class="sub">מחיר משוער ב${marketName} · המחיר הסופי והמשלוח באתר המקור</div>
    </div>` : '';

  // מבחן השטח (רק נבדק עם ציונים)
  const validScores = (p.scores || []).filter(s => s.label && (s.value || s.value === 0));
  const testCard = (tested && validScores.length) ? `
    <div class="test">
      <div class="t"><span class="mk">✓</span>מבחן השטח של אור</div>
      ${(p.test_note || p.test_date) ? `<div class="subt">${[p.test_date ? 'נבדק · ' + esc(fmtMonth(p.test_date)) : '', esc(p.test_note || '')].filter(Boolean).join(' · ')}</div>` : ''}
      ${validScores.map(s => `<div class="bar"><span>${esc(s.label)}</span><span class="tr"><span class="fl" style="width:${Math.max(0, Math.min(100, s.value * 10))}%"></span></span><span class="num">${s.value}</span></div>`).join('')}
      ${p.verdict ? `<div class="verdictline">"${esc(p.verdict)}"</div>` : ''}
      <div class="who"><span class="face"></span>אור · קבלן גגות · בודק כל כלי לפני שהוא נכנס לרשימה</div>
    </div>` : '';

  const candBox = !tested ? `<div class="candbox">עוד לא עבר את מבחן-השטח — הזמנתי, אני בודק, ואעדכן. נראה מבטיח מספיק כדי לשתף.</div>` : '';

  const pros = (p.pros || []).filter(Boolean), cons = (p.cons || []).filter(Boolean);
  const prosCons = (pros.length || cons.length) ? `
    <div class="pm">
      <div class="col g"><b>למה כן</b>${pros.map(v => `<div>${esc(v)}</div>`).join('') || '<div>—</div>'}</div>
      <div class="col r"><b>שווה לדעת</b>${cons.map(v => `<div>${esc(v)}</div>`).join('') || '<div>—</div>'}</div>
    </div>` : '';

  const related = PRODUCTS.filter(x => x.id !== p.id && x.category === p.category).slice(0, 4);
  const relBlock = related.length ? `
    <h3 class="sec">עוד כלים שעברו את המבחן</h3>
    <div class="rel">${related.map(r => {
      const img = cardImg(r);
      const tag = r.tier === 'tested' ? '<span class="tg">נבדק ✓</span>' : '<span class="tg c">בבדיקה עכשיו</span>';
      return `<a class="rc" href="#p/${esc(r.id)}"><div class="im">${tag}${img ? `<img src="${esc(img)}" alt="">` : 'אין תמונה'}</div><div class="b"><div class="t">${esc(r.title)}</div>${r.price_approx ? `<div class="p">₪${Math.round(r.price_approx)}</div>` : ''}</div></a>`;
    }).join('')}</div>` : '';

  const thumbs = items.length > 1 ? `<div class="thumbs" id="thumbs">${items.map((it, i) => `<button type="button" class="th${it.type === 'video' ? ' vid' : ''}${i === 0 ? ' on' : ''}" data-i="${i}">${it.type === 'image' ? `<img src="${esc(it.src)}" alt="">` : ''}</button>`).join('')}</div>` : '';

  const ctaHtml = `<div class="cta"><button type="button" id="cta-btn">${esc(ctaText(p))}</button><div class="sub">נפתח באתר המקור · קישור-שותפים, אני מקבל עמלה קטנה</div></div>`;
  el('app').innerHTML = `
    <div class="phone">
      ${brandHeader(true)}
      <div class="pcols">
        <div class="pmedia">
          <div class="hero">
            <div class="shot">
              <span class="badge${tested ? '' : ' c'}">${tested ? 'נבדק בשטח ✓' : 'בבדיקה עכשיו'}</span>
              <div class="main" id="hero-main"></div>
              <span class="mine" id="hero-credit" style="display:none">צולם על-ידי · אור</span>
            </div>
            ${thumbs}
            <h1>${esc(p.title)}</h1>
            ${p.punchline ? `<div class="punch">${esc(p.punchline)}</div>` : ''}
          </div>
        </div>
        <div class="pinfo">
          ${buyCard}
          ${testCard}
          ${candBox}
          ${prosCons}
          ${ctaHtml}
        </div>
      </div>
      ${relBlock}
      <div class="disc">גילוי נאות: הקישורים באתר הם קישורי-שותפים — אם קונים דרכם, אני מקבל עמלה קטנה. זה לא עולה לכם שקל, וזה מה שמחזיק את האתר. אני ממליץ רק על מה שבדקתי בעצמי או שנראה לי שווה בדיקה.</div>
    </div>`;

  el('go-home').addEventListener('click', () => { location.hash = ''; });
  setHero(items, 0);
  if (items.length > 1) el('thumbs').querySelectorAll('.th').forEach(b => b.addEventListener('click', () => {
    el('thumbs').querySelectorAll('.th').forEach(x => x.classList.toggle('on', x === b));
    setHero(items, Number(b.dataset.i));
  }));
  wireCta(p);   // S18
}
function setHero(items, idx){
  const main = el('hero-main'), credit = el('hero-credit');
  if (!items.length) { main.innerHTML = `<div class="pht">הצילומים של אור יופיעו כאן</div>`; credit.style.display = 'none'; return; }
  const it = items[idx];
  main.innerHTML = it.type === 'video'
    ? `<video src="${esc(it.src)}" controls playsinline></video>`
    : `<img src="${esc(it.src)}" alt="">`;
  credit.style.display = (it.mine && it.type === 'image') ? '' : 'none';
}
function wireCta(p){
  // חשוב: מחובר בתוך renderProduct — הכפתור נוצר מחדש בכל רנדור של דף-מוצר.
  el('cta-btn').addEventListener('click', () => {
    // ב-supabase-js הבנאי עצל — חייבים .then() כדי שהבקשה תצא בפועל.
    // .then() (ולא await) מפעיל את השליחה בלי לעכב את פתיחת הקישור.
    sb.rpc('register_click', { pid: p.id, src: clickSrc }).then(() => {}, () => {});
    window.open(p.affiliate_url, '_blank', 'noopener');
  });
}

load();
</script>
</body>
</html>
